name: UI Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-slim
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "tools/ui/package-lock.json"

      - name: Resolve build number
        run: echo "LLAMA_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci
        working-directory: tools/ui

      - name: Build application
        run: npm run build
        working-directory: tools/ui

      - name: Run PWA unit tests (versioned build output)
        run: npx vitest --project=unit --run tests/unit/pwa.spec.ts
        working-directory: tools/ui

      - name: Upload built UI
        uses: actions/upload-artifact@v6
        with:
          name: ui-build
          path: tools/ui/dist/
          retention-days: 1
