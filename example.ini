[general]
app.name = MyApplication
version = 3.2.1
debug = true
log.level = verbose

[database]
host = 192.168.1.100
port = 5432
name = production_db
user = admin
password = s3cret!@$%^&*()
max_connections = 50
timeout.ms = 30000
ssl.enabled = true
ssl.cert-path = /etc/certs/db.pem

[cache]
engine = redis
host = cache-01.internal
port = 6379
ttl = 3600
max-memory = 256MB

[logging]
file = /var/log/myapp/app.log
rotation = daily
max-size = 100MB
format = json
include.timestamps = true
include.thread-id = true

[server.http]
bind = 0.0.0.0
port = 8080
workers = 4
keep-alive = 60
max-request-size = 10MB

[server.https]
bind = 0.0.0.0
port = 8443
cert = /etc/ssl/server.crt
key = /etc/ssl/server.key

[feature-flags]
enable.v2-api = true
enable.websockets = false
enable.rate-limiting = true
rate-limit.requests = 1000
rate-limit.window = 60

[paths]
data = /opt/myapp/data
temp = /tmp/myapp
plugins = /opt/myapp/plugins
static.assets = /var/www/static

; environment overrides
[env.staging]
database.host = staging-db.internal
debug = true
log.level = debug

# production tuning
[env.production]
database.host = prod-db.internal
debug = false
workers = 16
cache.ttl = 7200
